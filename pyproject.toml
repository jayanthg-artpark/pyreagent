[project]
name = "pyreagent"
version = "0.1.0"
description = "Agent-safe lab instrument drivers with auto-generated HTTP and MCP servers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=1.9",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
pyreagent = "pyreagent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyserial>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyreagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
