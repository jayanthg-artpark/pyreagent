# Example device server for a bench with real instruments.
#   pyreagent serve examples/bench.toml
# Set PYREAGENT_OPERATOR_TOKEN to protect the connect/disconnect and force-release endpoints.

[server]
name = "bench-1"
host = "0.0.0.0"
port = 8000
public_url = "http://bench-1.local:8000"      # what other machines use to reach this server
registry_url = "http://registry.local:9000"   # remove if you are not running `pyreagent registry`
audit_log = "logs/bench-1.audit.jsonl"
mcp_allowed_hosts = ["localhost:*", "127.0.0.1:*", "bench-1.local:*"]

# Labware the plate reader should accept, in addition to the built-in catalog.
[[labware]]
id = "lab_96_deepwell"
description = "In-house 96 deep-well plate"
rows = 8
columns = 12
well_volume_ul = 2000

[[devices]]
name = "balance-1"
type = "balance"
driver = "mettler_toledo"                     # pyreagent/devices/balance/mettler_toledo/
driver_options = { port = "COM3", baudrate = 9600 }

[[devices]]
name = "syringe-1"
type = "pump"
driver = "new_era"                            # pyreagent/devices/pump/new_era/
# Inside diameter from your syringe maker's table; it sets the volume calibration.
driver_options = { port = "COM4", syringe_diameter_mm = 14.43, address = 0 }
options = { max_volume_ml = 10.0, min_rate_ml_min = 0.001, max_rate_ml_min = 20.0 }

[[devices]]
name = "reader-1"
type = "plate_reader"
driver = "simulated"                          # until a real plate reader driver exists

# --- Opentrons OT-2 with a Thermocycler and a Temperature Module -----------------------
# The pipettes and the modules are separate devices, but they share the robot's run:
# give them the same host and robot. Declare labware by Opentrons load name.
[[devices]]
name = "ot2-1"
type = "liquid_handler"
driver = "opentrons"                          # pyreagent/devices/liquid_handler/opentrons/
driver_options = { host = "192.168.1.50", robot = "ot2" }   # host = "auto" finds it via mDNS (pip install 'pyreagent[opentrons]')
# driver_options = { host = "192.168.1.50", robot = "ot2", labware_definitions = ["labware/lab_24_tuberack.json"] }

[devices.options.deck]
"1" = "opentrons_96_tiprack_300ul"
"2" = "opentrons_96_tiprack_20ul"
"3" = { labware = "nest_12_reservoir_15ml", initial_volume_ul = 12000 }
"4" = { labware = "corning_96_wellplate_360ul_flat", initial_volume_ul = 0 }
"7" = { labware = "opentrons_96_wellplate_200ul_pcr_full_skirt", initial_volume_ul = 0 }   # on the thermocycler

[[devices]]
name = "ot2-tc"
type = "thermocycler"
driver = "opentrons"                          # pyreagent/devices/thermocycler/opentrons/robot.py
driver_options = { host = "192.168.1.50", robot = "ot2", block_max_volume_ul = 25 }   # sits in slots 7/8/10/11

[[devices]]
name = "ot2-temp"
type = "temperature_controller"
driver = "opentrons"                          # pyreagent/devices/temperature_controller/opentrons/robot.py
driver_options = { host = "192.168.1.50", robot = "ot2", slot = "3" }
options = { min_c = 4, max_c = 95 }

