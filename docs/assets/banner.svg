<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="title desc">
  <title id="title">pyreagent</title>
  <desc id="desc">Instrument drivers AI agents can operate safely: HTTP and OpenAPI, MCP tools, human approval, simulation. Illustrated with a 96-well plate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="1" stop-color="#0E2440"/>
    </linearGradient>
    <radialGradient id="halo" cx="1010" cy="160" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1280" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 3px; fill: #5EEAD4; }
      .word { font-size: 84px; font-weight: 700; fill: #F8FAFC; }
      .word-accent { fill: #2DD4BF; }
      .tagline { font-size: 22px; fill: #CBD5E1; }
      .chip { fill: #0F2A44; stroke: #2B5B84; stroke-width: 1.2; }
      .chip-text { font-size: 14.5px; font-weight: 600; fill: #E2E8F0; }
      .plate { fill: #0F1F36; stroke: #2B4C78; stroke-width: 1.5; }
      .plate-inner { fill: none; stroke: #1C3557; stroke-width: 1; }
      .well { fill: #0A1628; stroke: #2A4A75; stroke-width: 1.2; }
      .axis { font-size: 10px; font-weight: 600; fill: #5B7BA6; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; }
      .d1 { animation-delay: 0.8s; } .d2 { animation-delay: 1.6s; } .d3 { animation-delay: 2.4s; }
      @keyframes pulse { 0%, 100% { fill-opacity: 0.45; } 50% { fill-opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#halo)"/>
  </g>
  <g class="sans">
    <text x="72" y="84" class="eyebrow">AGENT-SAFE LAB AUTOMATION</text>
    <text x="68" y="168" class="word mono"><tspan class="word-accent">py</tspan>reagent</text>
    <text x="72" y="222" class="tagline">Instrument drivers AI agents can operate safely.</text>
